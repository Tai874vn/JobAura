<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JobAura — Auth redesign preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --background: #eff1f5; --foreground: #1b1c1c; --surface: #ffffff; --surface-muted: #f6f3f2;
    --border: #dcd9d9; --muted: #5f6b62; --primary: #006d43; --primary-bright: #00a86b;
    --accent: #d2d92d; --rating: #fbbc00; --danger: #ba1a1a; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--background); color: var(--foreground);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  svg { width: 16px; height: 16px; }
  .display { font-family: "Hanken Grotesk", Inter, sans-serif; }

  /* preview-only top bar */
  .switcher { display: flex; justify-content: center; gap: 8px; padding: 18px 20px 0; }
  .switcher button {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 15px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
  }
  .switcher button svg { width: 13px; height: 13px; color: var(--primary); }
  .switcher button.active { background: var(--foreground); border-color: var(--foreground); color: #fff; }
  .switcher button.active svg { color: var(--accent); }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px 56px; }
  .auth-card {
    width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 12px 40px rgba(27,28,28,0.05); padding: 28px 26px 24px;
  }
  .brand-row { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 22px; }
  .brand-mark {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    background: var(--primary); color: #fff; font-family: "Hanken Grotesk", sans-serif;
    font-size: 19px; font-weight: 800;
  }
  .brand-name { font-family: "Hanken Grotesk", sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--primary); }
  .auth-card h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; text-align: center; }
  .auth-card .subtitle { margin: 6px 0 0; text-align: center; font-size: 13.5px; color: var(--muted); }
  form { margin-top: 22px; display: grid; gap: 14px; }

  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .field .control { display: flex; align-items: center; height: 44px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); transition: border-color .15s; }
  .field .control:focus-within { border-color: var(--primary); }
  .field input { flex: 1; min-width: 0; height: 100%; padding: 0 12px; border: 0; outline: 0; font: inherit; background: transparent; }
  .field .eye { display: grid; place-items: center; width: 42px; height: 100%; color: var(--muted); }
  .field .eye:hover { color: var(--foreground); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px;
    border-radius: var(--radius); font-size: 14px; font-weight: 600; transition: background .15s, border-color .15s, color .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-bright); }
  .btn-secondary { border: 1px solid var(--border); background: var(--surface); }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  .btn-block { width: 100%; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 4px 0; }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--border); }
  .divider span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }

  .role-cards { display: grid; gap: 10px; }
  .role-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .role-card {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); transition: border-color .15s, background .15s;
  }
  .role-card:hover { border-color: var(--primary); }
  .role-card.selected { border-color: var(--primary); background: rgba(0,109,67,0.05); }
  .role-card .radio { display: grid; place-items: center; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; }
  .role-card.selected .radio { border-color: var(--primary); }
  .role-card.selected .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  .role-card b { font-size: 13.5px; }
  .role-card span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; line-height: 1.5; }

  .foot { margin-top: 18px; text-align: center; font-size: 13.5px; color: var(--muted); }
  .foot a { color: var(--primary); font-weight: 600; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="switcher">
  <button class="active" data-view="login"><i data-lucide="log-in"></i> Sign in page</button>
  <button data-view="register"><i data-lucide="user-plus"></i> Register page</button>
</div>

<main>
  <!-- ===== LOGIN ===== -->
  <section class="auth-card" id="view-login">
    <div class="brand-row">
      <span class="brand-mark">JA</span>
      <span class="brand-name">JobAura</span>
    </div>
    <h1 class="display">Welcome back</h1>
    <p class="subtitle">Sign in to hire, post, and manage JobAura services.</p>

    <form>
      <div class="field">
        <label for="l-email">Email</label>
        <div class="control"><input id="l-email" type="email" placeholder="you@example.com" /></div>
      </div>
      <div class="field">
        <label for="l-password">Password</label>
        <div class="control">
          <input id="l-password" type="password" placeholder="Your password" />
          <button class="eye" type="button" aria-label="Show password"><i data-lucide="eye"></i></button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>

    <div class="divider" style="margin-top: 18px;"><span>or</span></div>
    <button class="btn btn-secondary btn-block" type="button"><i data-lucide="chrome"></i> Continue with Google</button>

    <p class="foot">New here? <a href="#">Create an account</a></p>
  </section>

  <!-- ===== REGISTER ===== -->
  <section class="auth-card" id="view-register" hidden>
    <div class="brand-row">
      <span class="brand-mark">JA</span>
      <span class="brand-name">JobAura</span>
    </div>
    <h1 class="display">Create your JobAura account</h1>
    <p class="subtitle">Start buying or selling trusted freelance services.</p>

    <form>
      <div class="field">
        <label for="r-name">Full name</label>
        <div class="control"><input id="r-name" placeholder="Your name" /></div>
      </div>
      <div class="field">
        <label for="r-email">Email</label>
        <div class="control"><input id="r-email" type="email" placeholder="you@example.com" /></div>
      </div>
      <div class="field">
        <label for="r-password">Password</label>
        <div class="control">
          <input id="r-password" type="password" placeholder="At least 10 characters" />
          <button class="eye" type="button" aria-label="Show password"><i data-lucide="eye"></i></button>
        </div>
      </div>
      <div class="role-cards">
        <p class="role-label">Account type</p>
        <label class="role-card selected">
          <input class="radio" type="radio" name="r-role" checked />
          <span style="min-width: 0;">
            <b>Worker</b>
            <span>Build a profile, post services, and receive job matches.</span>
          </span>
        </label>
        <label class="role-card">
          <input class="radio" type="radio" name="r-role" />
          <span style="min-width: 0;">
            <b>Employer</b>
            <span>Find candidates, review profiles, and start hiring conversations.</span>
          </span>
        </label>
      </div>
      <button class="btn btn-secondary btn-block" type="button" style="margin-top: 16px;"><i data-lucide="chrome"></i> Continue with Google</button>
      <div class="divider"><span>or</span></div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <p class="foot">Already have an account? <a href="#">Sign in</a></p>
  </section>
</main>

<div class="preview-flag" style="position: fixed; bottom: 16px; left: 16px; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--foreground); color: #fff; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">
  <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent);"></span> Auth preview
</div>

<script>
  lucide.createIcons();
  const buttons = document.querySelectorAll('.switcher button');
  buttons.forEach((btn) => btn.addEventListener('click', () => {
    buttons.forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-login').hidden = btn.dataset.view !== 'login';
    document.getElementById('view-register').hidden = btn.dataset.view !== 'register';
  }));
  document.querySelectorAll('.eye').forEach((eye) => eye.addEventListener('click', () => {
    const input = eye.parentElement.querySelector('input');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.innerHTML = show ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
    lucide.createIcons();
  }));
  document.querySelectorAll('.role-card').forEach((card) => card.addEventListener('click', () => {
    document.querySelectorAll('.role-card').forEach((c) => c.classList.remove('selected'));
    card.classList.add('selected');
    card.querySelector('input').checked = true;
  }));
</script>
</body>
</html>
